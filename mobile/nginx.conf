server {
  listen 80;
  root /usr/share/nginx/html;

  # /api/insumos -> http://api:3333/insumos
  location /api/ {
    proxy_pass http://api:3333/;
    proxy_set_header Host $host;
  }

  # Qualquer outra rota (ex.: /receitas/3) abre o app, que cuida da navegação.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
